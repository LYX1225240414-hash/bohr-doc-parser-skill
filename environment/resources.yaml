name: literature-pdf-parser
version: 1.2.2
entrypoint: ../SKILL.md
bundle_root: ..
description: >
  科研 PDF 文献解析 Skill 的资源清单。执行内核为 resources/pdf_parser.py，
  负责逐页提取正文/题注/脚注/表格/公式与章节结构、按块左边缘聚类校正多栏阅读顺序、
  合并段落折行、识别跨页 running head 与页码并排除、还原表头行与参考文献条目，
  为每段结论绑定页码与区块锚点并做真实短引回查，同时产出 ARM v1.1 复核产物。

resources:
  - path: resources/pdf_parser.py
    kind: executable
    runtime: python3
    entry: "python3 resources/pdf_parser.py --case /input/case.json --out /app/output"
    requires: []
    requires_note: >
      抽取链按序探测：PyMuPDF → pdfplumber → 平台预装 pdf-text-tool（接口不固定，依次尝试
      <path> / --input <path> / extract <path>，只认退出码 0 且确有文本的输出）→
      pdftotext -layout → pypdf。全部不可用时如实返回 status=unable，不伪造解析结果；
      结构化与核验部分为纯标准库实现，不引入额外依赖。
    inputs:
      - "/input/case.json 指定的真实 PDF（不做预抽文字层假设）"
      - "平台 pdf-text-tool 抽出的逐页文本（如可得）"
    outputs:
      - "/app/output/result.json"
      - "/app/output/ARM v1.1 复核产物（清单见 resources/arm_contract.md）"
    outputs_note: >
      脚本内自带计数自检（正文覆盖率、栏序判定、页眉页脚剔除数、表格表头回收、
      锚点短引回查命中数、未解析页清单），可直接作为 result.json 中 verification 的计数底稿；
      回查失败的短引会自动进入 uncertainties，不静默通过。

  - path: resources/arm_contract.md
    kind: doc
    purpose: ARM v1.1 产物清单、字段含义与缺失补齐规则（本题唯一按 ARM 产物评分的题）

  - path: resources/parsing_playbook.md
    kind: doc
    purpose: 工具探测、栏序判据、页眉页脚识别、表格与公式还原规则、OCR 回退流程

  - path: resources/checklist.md
    kind: doc
    purpose: 带计数的自检清单

  - path: resources/field_dict.md
    kind: doc
    purpose: 字段字典、锚点格式与 verification 计数项

  - path: resources/output_example.json
    kind: sample
    purpose: 输出结构示意（占位，非任何真实文献的解析结果）

  - path: examples/README.md
    kind: doc
    purpose: 最小调用示例与从 PDF 到 ARM 产物的完整步骤

platform_tools_used:
  - name: pdf-text-tool
    purpose: 抽取逐页文字层（镜像无 Python PDF 库时为主路径；脚本已内置该命令的容错调用）
  - name: pdf-render-tool
    purpose: 页面渲图，用于校验栏序与图表位置
  - name: ocr-tool
    purpose: 文字层缺失或扫描件时兜底；仍失败则该页标注不可解析并降级 partial

runtime:
  python: ">=3.9"
  network: not_required
  notes: >
    只读输入 PDF，不改动输入目录；所有结构化结论带页码与区块锚点。
    读不出的页/表/公式一律标注并计入 uncertainties，不猜内容。

changelog:
  - "1.2.1: --out 兼容目录或文件名；抽取链与 ARM 产物不变。"
